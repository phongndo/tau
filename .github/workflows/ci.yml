name: CI

env:
  ZIG_VERSION: '0.16.0'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Required memory-safety gate (kept separate) ──
  memory-safety:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24' }
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-
      - run: bun install --frozen-lockfile
      - run: |
          set -euo pipefail
          IFS=$'\n\t'
          bun run zig:check
          export TAUD_CI_HOME="$(mktemp -d)"
          trap 'rm -rf "$TAUD_CI_HOME"' EXIT
          HOME="$TAUD_CI_HOME" bun run --filter @tau/daemon check
          bun run zig:leak-check
  # ── Combined quality gate: frontend (Bun) + Zig daemon ──
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAUD_SKIP_NATIVE: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24' }
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-
      - run: bun install --frozen-lockfile
      - name: Lint (TypeScript + Zig)
        run: bun run lint
      - name: Format check (TypeScript + Zig)
        run: bun run fmt:check
      - name: TypeScript type check
        run: bun run tsc
      - name: Zig unit tests
        run: bun run zig:test
      - name: Persistence and tooling tests
        run: bun run test

  # ── Build matrix across platforms ──
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: tau-dist-ubuntu
            skip_native: '1'
          - os: macos-15
            artifact: tau-dist-macos
          - os: windows-latest
            artifact: tau-dist-windows
            shell: bash
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ matrix.shell || 'bash' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24' }
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-
      - run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
        env:
          TAUD_SKIP_NATIVE: ${{ matrix.skip_native }}
      - name: Bun-compiled Electron benchmark smoke
        if: runner.os == 'macOS'
        timeout-minutes: 2
        run: bun run --filter @tau/desktop bench:addons
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.artifact != 'tau-dist-windows'
        with:
          name: ${{ matrix.artifact }}
          path: apps/desktop/out/
